# Backend to use: "xrender" or "glx" (glx is recommended for better vsync performance)
backend = "glx";

# Enable VSync to eliminate screen tearing
vsync = true;

# Disable all extra visual features for maximum performance
shadow = false;
fading = false;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-overridden = false;
blur-background = false;
